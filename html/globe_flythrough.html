<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LCM-10 Flythrough — MapLibre GL JS</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.22.0/dist/maplibre-gl.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
    }

    #map {
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    /* Hide all MapLibre UI chrome */
    .maplibregl-ctrl-top-right,
    .maplibregl-ctrl-bottom-right,
    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-top-left {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    (function () {
      var js = document.createElement('script');
      js.src = 'https://unpkg.com/maplibre-gl@5.22.0/dist/maplibre-gl.js';
      document.head.appendChild(js);
      var t = setInterval(function () {
        if (window.maplibregl) { clearInterval(t); initMap(); }
      }, 50);
    })();

    function initMap() {
      const MAPPROXY_TILES =
        'https://mapproxy.terrascope.be/mapproxy/wmts/LCM_2020/webmercator/{z}/{x}/{y}.png';

      const BLUE_MARBLE_TILES =
        'https://basemap.nationalmap.gov/arcgis/services/USGSImageryOnly/MapServer/WMSServer'
        + '?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0'
        + '&LAYERS=0&STYLES=&FORMAT=image/png&TRANSPARENT=false'
        + '&CRS=EPSG:3857&WIDTH=256&HEIGHT=256'
        + '&BBOX={bbox-epsg-3857}';

      window.map = new maplibregl.Map({
        container: 'map',
        attributionControl: false,
        hash: false,
        style: {
          version: 8,
          projection: { type: 'globe' },
          sources: {},
          layers: [],
          sky: { 'atmosphere-blend': 0 },
        },
        center: [14.89, 28.18],
        zoom: 3.03,
        preserveDrawingBuffer: true,
      });

      window.map.on('load', () => {
        window.map.addSource('blue-marble', {
          type: 'raster',
          tiles: [BLUE_MARBLE_TILES],
          tileSize: 256,
          attribution: '© USGS',
        });
        window.map.addLayer({
          id: 'blue-marble',
          type: 'raster',
          source: 'blue-marble',
        });

        window.map.addSource('lcm10', {
          type: 'raster',
          tiles: [MAPPROXY_TILES],
          tileSize: 256,
          maxzoom: 14,
          attribution: '© VITO 2026. CC-BY 4.0',
        });
        window.map.addLayer({
          id: 'lcm10',
          type: 'raster',
          source: 'lcm10',
          paint: { 'raster-opacity': 1.0, 'raster-resampling': 'nearest' },
        });

        // Signal that the map is fully ready for Playwright
        window._mapReady = true;
      });
    }
  </script>
</body>

</html>
