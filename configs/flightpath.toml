# Flight-path rendering configuration for flythrough_recorder.py.
#
# Run:
#   uv run python scripts/flythrough_recorder.py --config configs/flightpath.toml --name africa_zoom
#
# Each [[flightpath]] entry defines one video.
# [settings] apply to all entries and can be overridden per [[flightpath]].

[settings]
fps        = 30
width      = 1080
height     = 1080
duration_s = 15.0   # total video length; divided equally across segments
pre_frames = 15     # static hold on first waypoint before flight starts
post_frames = 30    # static hold on last waypoint after flight ends

# ---------------------------------------------------------------------------
# africa_zoom — continuous zoom-in over the Sahel / Libya region
# ---------------------------------------------------------------------------
[[flightpath]]
name   = "africa_zoom"
output = "images/flythrough_africa.mp4"

  [[flightpath.waypoints]]
  zoom = 2.73
  lat  = 20.63
  lon  = 13.5

